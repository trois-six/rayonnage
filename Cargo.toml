[package]
name = "rayonnage"
version = "0.1.0"
edition = "2024"
description = "Comic, BD and manga library manager inspired by ComicRack CE"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.24", features = ["compress"] }
unrar = "0.5"
tar = "0.4"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking", "cookies"] }
scraper = "0.29"
image = "0.25"
walkdir = "2"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
async-channel = "2"
lopdf = "0.46"
html-escape = "0.3"
urlencoding = "2"
anyhow = "1"
crc32fast = "1"
sys-locale = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
rmp-serde = "1"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
